    <script>
'use strict';

// ---- FONCTION OPEN TAB ----
function openTab(tabName, btn) {
  const tabs = document.querySelectorAll('.tab-content');
  const btns = document.querySelectorAll('.tab-btn');
  tabs.forEach(tab => tab.classList.remove('active'));
  btns.forEach(b => b.classList.remove('active'));
  document.getElementById(tabName + '-tab').classList.add('active');
  btn.classList.add('active');
}

// ---- ÉTAT GLOBAL ----
let currentModel = 'islm';
let modelParams = {};
let initialParams = {};
let solution = null;
let initialSolution = null;
let multipliers = {};

let zoomLevel = 1;
let panX = 0, panY = 0;
let isDragging = false, lastX = 0, lastY = 0;

let oldPtsIS = [];
let oldPtsLM = [];
let oldPtsBP = [];
let oldSolution = null;

const canvas = () => document.getElementById('canvas');
const ctx = () => canvas().getContext('2d');

// ---- DÉFINITION DES MODÈLES ----
const models = {
  islm: {
    name: 'Modèle IS-LM',
    equations: [
      { latex: 'Y = C(Y - T) + I(r) + G', desc: 'Courbe IS (équilibre du marché des biens)' },
      { latex: 'C = c_0 + c_1(Y - T)', desc: 'Fonction de consommation' },
      { latex: 'I = I_0 - br', desc: "Fonction d'investissement" },
      { latex: '\\frac{M}{P} = L(Y, r) = kY - hr', desc: 'Courbe LM (équilibre monétaire)' },
    ],
    explanation:
      "Le modèle IS-LM représente l'équilibre simultané sur le marché des biens (IS) et le marché monétaire (LM).",
    params: [
      { id: 'c0', label: 'Consommation autonome (c₀)', default: 100, min: 0, max: 500 },
      { id: 'c1', label: 'Propension marginale à consommer (c₁)', default: 0.8, min: 0, max: 1, step: 0.01 },
      { id: 'b',  label: "Sensibilité de l'investissement au taux (b)", default: 50, min: 10, max: 200 },
      { id: 'I0', label: 'Investissement autonome (I₀)', default: 150, min: 0, max: 500 },
      { id: 'G',  label: 'Dépenses publiques (G)', default: 300, min: 0, max: 500 },
      { id: 'T',  label: 'Taxes (T)', default: 100, min: 0, max: 500 },
      { id: 'M',  label: 'Offre de monnaie (M)', default: 1000, min: 100, max: 3000 },
      { id: 'P',  label: 'Niveau des prix (P)', default: 1, min: 0.1, max: 5, step: 0.1 },
      { id: 'k',  label: 'Sensibilité de la demande de monnaie au revenu (k)', default: 0.5, min: 0.1, max: 1, step: 0.01 },
      { id: 'h',  label: 'Sensibilité de la demande de monnaie au taux (h)', default: 100, min: 10, max: 500 },
    ],
    sliders: [
      { id: 'G', label: 'Dépenses publiques (G)', desc: 'Politique budgétaire expansionniste → IS → droite' },
      { id: 'M', label: 'Offre de monnaie (M)', desc: 'Politique monétaire expansionniste → LM → bas' },
      { id: 'T', label: 'Taxes (T)', desc: 'Hausse des taxes → IS → gauche' },
    ],
    policies: [
      { id: 'budget_exp', label: 'Politique budgétaire expansionniste', param: 'G', change: 50 },
      { id: 'budget_res', label: 'Politique budgétaire restrictive', param: 'G', change: -50 },
      { id: 'monet_exp', label: 'Politique monétaire expansionniste', param: 'M', change: 500 },
      { id: 'monet_res', label: 'Politique monétaire restrictive', param: 'M', change: -500 },
    ]
  },
  'islm-bp': {
    name: 'Modèle IS-LM-BP',
    equations: [
      { latex: 'Y = C(Y - T) + I(r) + G + NX(Y, e)', desc: 'IS en économie ouverte' },
      { latex: 'NX = NX_0 - mY', desc: 'Exportations nettes' },
      { latex: '\\frac{M}{P} = L(Y, r) = kY - hr', desc: 'LM' },
      { latex: 'BP: NX(Y) + KA(r - r^*) = 0', desc: 'Balance des paiements' },
      { latex: 'KA = n(r - r^*)', desc: 'Compte de capital' },
    ],
    explanation:
      "Le modèle IS-LM-BP étend IS-LM à l'économie ouverte et introduit la condition d'équilibre externe (BP).",
    params: [
      { id: 'c0', label: 'Consommation autonome (c₀)', default: 100, min: 0, max: 500 },
      { id: 'c1', label: 'Propension marginale à consommer (c₁)', default: 0.8, min: 0, max: 1, step: 0.01 },
      { id: 'b',  label: 'Sensibilité de l’investissement (b)', default: 50, min: 10, max: 200 },
      { id: 'I0', label: 'Investissement autonome (I₀)', default: 150, min: 0, max: 500 },
      { id: 'G',  label: 'Dépenses publiques (G)', default: 200, min: 0, max: 500 },
      { id: 'T',  label: 'Taxes (T)', default: 100, min: 0, max: 500 },
      { id: 'M',  label: 'Offre de monnaie (M)', default: 1000, min: 100, max: 3000 },
      { id: 'P',  label: 'Niveau des prix (P)', default: 1, min: 0.1, max: 5, step: 0.1 },
      { id: 'k',  label: 'Sensibilité de la demande de monnaie au revenu (k)', default: 0.5, min: 0.1, max: 1, step: 0.01 },
      { id: 'h',  label: 'Sensibilité de la demande de monnaie au taux (h)', default: 100, min: 10, max: 500 },
      { id: 'm',  label: 'Propension marginale à importer (m)', default: 0.1, min: 0, max: 0.5, step: 0.01 },
      { id: 'NX0',label: 'Exportations nettes autonomes (NX₀)', default: 50, min: -200, max: 200 },
      { id: 'n',  label: 'Mobilité des capitaux (n)', default: 100, min: 10, max: 500 },
      { id: 'r_star', label: "Taux d'intérêt étranger (r*)", default: 5, min: 0, max: 20, step: 0.1 },
    ],
    sliders: [
      { id: 'G',   label: 'Dépenses publiques (G)', desc: 'Budget ↑ → IS droite → risque excédent BP' },
      { id: 'M',   label: 'Offre de monnaie (M)',   desc: 'Monétaire ↑ → LM bas → risque déficit BP' },
      { id: 'NX0', label: 'Exportations nettes (NX₀)', desc: 'Choc externe → IS & BP → droite/gauche' },
    ],
    policies: [
      { id: 'budget_exp', label: 'Politique budgétaire expansionniste', param: 'G', change: 50 },
      { id: 'budget_res', label: 'Politique budgétaire restrictive', param: 'G', change: -50 },
      { id: 'monet_exp', label: 'Politique monétaire expansionniste', param: 'M', change: 500 },
      { id: 'monet_res', label: 'Politique monétaire restrictive', param: 'M', change: -500 },
      { id: 'nx_exp', label: 'Choc positif sur les exportations', param: 'NX0', change: 30 },
      { id: 'nx_res', label: 'Choc négatif sur les exportations', param: 'NX0', change: -30 },
    ]
  },
  megc: {
    name: "MEGC - Modèle d'Équilibre Général Calculable",
    equations: [
      { latex: 'Y = F(K, L) = K^\\alpha L^{1-\\alpha}', desc: 'Cobb-Douglas' },
      { latex: 'C + I = Y', desc: 'Ressources-emplois' },
      { latex: 'w = (1-\\alpha) Y/L', desc: 'PM du travail' },
      { latex: 'r = \\alpha Y/K', desc: 'PM du capital' },
      { latex: 'C = (1-s)Y', desc: 'Consommation' },
      { latex: 'I = sY', desc: 'Épargne = Investissement' },
    ],
    explanation:
      "Le MEGC détermine simultanément la production, les prix des facteurs et l'allocation Y = C + I.",
    params: [
      { id: 'K',     label: 'Stock de capital (K)', default: 100, min: 10, max: 500 },
      { id: 'L',     label: 'Offre de travail (L)', default: 100, min: 10, max: 500 },
      { id: 'alpha', label: 'Part du capital (α)', default: 0.3, min: 0.1, max: 0.9, step: 0.01 },
      { id: 's',     label: "Taux d'épargne (s)", default: 0.2, min: 0, max: 1, step: 0.01 },

// ---- RÉSOLUTION ----
function solveModel() {
  oldSolution = solution ? { ...solution } : null;
  
  if (currentModel === 'islm') solveISLM();
  else if (currentModel === 'islm-bp') solveISLMBP();
  else solveMEGC();
  
  if (!initialSolution) initialSolution = { ...solution };
  
  displayDetailedResults();
}

function solveISLM() {
  const { c0, c1, b, I0, G, T, M, P, k, h } = modelParams;

  const denom_IS = 1 - c1;
  const denom = h * (1 - c1) + k * b;

  const Y_star = (h * (c0 + I0 - c1 * T + G) + b * (M / P)) / denom;
  const r_star = (k * (c0 + I0 - c1 * T + G) - (1 - c1) * (M / P)) / denom;

  const C = c0 + c1 * (Y_star - T);
  const I = I0 - b * r_star;

  solution = { Y: Y_star, r: r_star, C, I };

  multipliers = {
    multG: h / denom,
    multT: -c1 * h / denom,
    multM: b / (P * denom),
    multG_simple: 1 / denom_IS,
  };
}

function solveISLMBP() {
  const { c0, c1, b, I0, G, T, M, P, k, h, m, NX0, n, r_star } = modelParams;
  const denom = h * (1 - c1 + m) + k * b;

  const Y_eq = (h * (c0 + I0 - c1 * T + G + NX0 - b * r_star) + b * (M / P)) / denom;
  const r_eq = (k * (c0 + I0 - c1 * T + G + NX0) - (1 - c1 + m) * (M / P) + h * r_star) / denom;

  const NX = NX0 - m * Y_eq;
  const C = c0 + c1 * (Y_eq - T);
  const I = I0 - b * r_eq;
  const BP = NX + n * (r_eq - r_star);

  solution = { Y: Y_eq, r: r_eq, NX, C, I, BP };

  multipliers = {
    multG: h / denom,
    multM: b / (P * denom),
    multNX: h / denom,
  };
}

function solveMEGC() {
  const { K, L, alpha, s } = modelParams;
  const Y = Math.pow(K, alpha) * Math.pow(L, 1 - alpha);
  const w = (1 - alpha) * Y / L;
  const r = alpha * Y / K;
  const C = (1 - s) * Y;
  const I = s * Y;
  const prodK = Y / K;
  const prodL = Y / L;

  solution = { Y, w, r, C, I, K, L, prodK, prodL };

  multipliers = {
    elastY_K: alpha,
    elastY_L: 1 - alpha,
    elastY_s: 0,
  };
}

// ---- DESSIN CANVAS ----
function clearCanvas() {
  const c = canvas(); const context = ctx();
  context.save();
  context.setTransform(1,0,0,1,0,0);
  context.clearRect(0, 0, c.width, c.height);
  context.restore();
}

function drawAxes(context, xMin, xMax, yMin, yMax, xLabel = 'Y', yLabel = 'r (%)') {
  const m = 50;
  context.strokeStyle = '#BBBBBB';
  context.lineWidth = 1;

  context.beginPath();
  context.moveTo(m + panX, (canvas().height - m) + panY);
  context.lineTo((canvas().width - m) + panX, (canvas().height - m) + panY);
  context.moveTo(m + panX, m + panY);
  context.lineTo(m + panX, (canvas().height - m) + panY);
  context.stroke();

  const ticks = 4;
  context.fillStyle = '#666';
  context.font = '12px serif';
  for (let i = 0; i <= ticks; i++) {
    const x = m + (i / ticks) * (canvas().width - 2 * m);
    const y = canvas().height - m;
    const vx = xMin + (i / ticks) * (xMax - xMin);
    context.fillText(vx.toFixed(0), x - 8 + panX, y + 20 + panY);
  }
  for (let j = 0; j <= ticks; j++) {
    const y = (canvas().height - m) - (j / ticks) * (canvas().height - 2 * m);
    const vy = yMin + (j / ticks) * (yMax - yMin);
    context.fillText(vy.toFixed(0), m - 40 + panX, y + 4 + panY);
  }

  context.fillText(xLabel, (canvas().width - m + 10) + panX, (canvas().height - m + 20) + panY);
  context.save();
  context.translate(m - 40 + panX, m + panY - 10);
  context.rotate(-Math.PI / 2);
  context.fillText(yLabel, 0, 0);
  context.restore();
}

function xMap(Y, xMin, xMax) {
  const m = 50;
  const W = canvas().width - 2 * m;
  return (m + ((Y - xMin) / (xMax - xMin)) * W);
}

function yMap(r, yMin, yMax) {
  const m = 50;
  const H = canvas().height - 2 * m;
  return ((canvas().height - m) - ((r - yMin) / (yMax - yMin)) * H);
}

function drawLine(context, points, color = '#000', width = 2, dashed = false) {
  context.strokeStyle = color;
  context.lineWidth = width;
  if (dashed) context.setLineDash([5, 5]);
  context.beginPath();
  points.forEach((p, i) => {
    if (i === 0) context.moveTo(p[0] + panX, p[1] + panY);
    else context.lineTo(p[0] + panX, p[1] + panY);
  });
  context.stroke();
  if (dashed) context.setLineDash([]);
}

function drawPoint(context, x, y, color = '#777') {
  context.fillStyle = color;
  context.beginPath();
  context.arc(x + panX, y + panY, 4, 0, 2 * Math.PI);
  context.fill();
}

function drawGraph() {
  const c = canvas();
  if (!c) return;
  const context = ctx();
  clearCanvas();

  context.save();
  context.translate((c.width / 2) * (1 - zoomLevel), (c.height / 2) * (1 - zoomLevel));
  context.scale(zoomLevel, zoomLevel);

  if (currentModel === 'islm' || currentModel === 'islm-bp') {
    const Ystar = solution?.Y ?? 100;
    const rstar = solution?.r ?? 5;

    const xMin = 0;
    const xMax = Math.max(500, 1.5 * Ystar);
    const yMin = 0;
    const yMax = Math.max(5, 1.5 * rstar);

    drawAxes(context, xMin, xMax, yMin, yMax);

    const { c0, c1, b, I0, G, T, M, P, k, h } = modelParams;
    const is_r = (Y) => (c0 + I0 - c1 * T + G - (1 - c1) * Y) / b;
    const lm_r = (Y) => (k / h) * Y - (M / (P * h));

    const ptsIS = [];
    const ptsLM = [];
    const N = 50;
    for (let i = 0; i <= N; i++) {
      const Y = xMin + (i / N) * (xMax - xMin);
      let r_is = is_r(Y);
      let r_lm = lm_r(Y);
      if (r_is >= yMin && r_is <= yMax && Y >= xMin && Y <= xMax) {
        ptsIS.push([xMap(Y, xMin, xMax), yMap(r_is, yMin, yMax)]);
      }
      if (r_lm >= yMin && r_lm <= yMax && Y >= xMin && Y <= xMax) {
        ptsLM.push([xMap(Y, xMin, xMax), yMap(r_lm, yMin, yMax)]);
      }
    }
    if (oldPtsIS.length > 0) drawLine(context, oldPtsIS, '#cccccc', 1.5);
    if (oldPtsLM.length > 0) drawLine(context, oldPtsLM, '#dddddd', 1.5);
    drawLine(context, ptsIS, '#000000', 2);
    drawLine(context, ptsLM, '#444444', 2);
    
    oldPtsIS = ptsIS;
    oldPtsLM = ptsLM;

    if (currentModel === 'islm-bp') {
      const { m, NX0, n, r_star } = modelParams;
      const bp_r = (Y) => r_star + (m * Y - NX0) / n;
      const ptsBP = [];
      for (let i = 0; i <= N; i++) {
        const Y = xMin + (i / N) * (xMax - xMin);
        let r_bp = bp_r(Y);
        if (r_bp >= yMin && r_bp <= yMax && Y >= xMin && Y <= xMax) {
          ptsBP.push([xMap(Y, xMin, xMax), yMap(r_bp, yMin, yMax)]);
        }
      }
      if (oldPtsBP.length > 0) drawLine(context, oldPtsBP, '#eeeeee', 1.5);
      drawLine(context, ptsBP, '#666666', 2);
      oldPtsBP = ptsBP;
    }

    if (solution) {
      const xE = xMap(solution.Y, xMin, xMax);
      const yE = yMap(solution.r, yMin, yMax);
      drawPoint(context, xE, yE, '#777777');
      
      drawLine(context, [[xE, yMap(0, yMin, yMax)], [xE, yE], [xMap(0, xMin, xMax), yE]], '#888888', 1, true);
      
      if (oldSolution) {
        const oldXE = xMap(oldSolution.Y, xMin, xMax);
        const oldYE = yMap(oldSolution.r, yMin, yMax);
        drawPoint(context, oldXE, oldYE, '#cccccc');
        drawLine(context, [[oldXE, yMap(0, yMin, yMax)], [oldXE, oldYE], [xMap(0, xMin, xMax), oldYE]], '#dddddd', 1, true);
      }
    }
  } else {
    // MEGC: Graphique de la fonction de production Y = F(K, L)
    const { L, alpha } = modelParams;
    const Kstar = modelParams.K;
    const Ystar = solution?.Y ?? Math.pow(Kstar, alpha) * Math.pow(L, 1 - alpha);

    const xMin = 0;
    const xMax = Math.max(200, 1.5 * Kstar);
    const yMin = 0;
    const yMax = 1.5 * Ystar;

    drawAxes(context, xMin, xMax, yMin, yMax, 'K', 'Y');

    const Y_of_K = (K) => Math.pow(K, alpha) * Math.pow(L, 1 - alpha);

    const pts = [];
    const oldPts = [];
    const N = 50;
    for (let i = 0; i <= N; i++) {
      const K = xMin + (i / N) * (xMax - xMin);
      pts.push([xMap(K, xMin, xMax), yMap(Y_of_K(K), yMin, yMax)]);
      
      // Ancienne courbe si elle existe
      if (oldSolution && oldSolution.K) {
        const oldY = Math.pow(K, alpha) * Math.pow(oldSolution.L, 1 - alpha);
        oldPts.push([xMap(K, xMin, xMax), yMap(oldY, yMin, yMax)]);
      }
    }
    
    // Dessiner l'ancienne courbe en gris si elle existe
    if (oldPts.length > 0) {
      drawLine(context, oldPts, '#cccccc', 1.5);
    }
    
    drawLine(context, pts, '#000000', 2);

    if (solution) {
      drawPoint(context, xMap(solution.K, xMin, xMax), yMap(solution.Y, yMin, yMax), '#666666');
      
      // Lignes pointillées pour le point d'équilibre
      drawLine(context, [
        [xMap(solution.K, xMin, xMax), yMap(0, yMin, yMax)],
        [xMap(solution.K, xMin, xMax), yMap(solution.Y, yMin, yMax)],
        [xMap(0, xMin, xMax), yMap(solution.Y, yMin, yMax)]
      ], '#888888', 1, true);
      
      if (oldSolution) {
        drawPoint(context, xMap(oldSolution.K, xMin, xMax), yMap(oldSolution.Y, yMin, yMax), '#cccccc');
      }
    }
  }

  context.restore();
}

// ---- ZOOM / PAN & TÉLÉCHARGEMENT ----
function zoomIn() { zoomLevel = Math.min(3, zoomLevel * 1.2); drawGraph(); }
function zoomOut() { zoomLevel = Math.max(0.4, zoomLevel / 1.2); drawGraph(); }
function resetZoom() { zoomLevel = 1; panX = 0; panY = 0; drawGraph(); }

function downloadCanvas() {
  const link = document.createElement('a');
  link.download = `macro_${currentModel}.png`;
  link.href = canvas().toDataURL('image/png');
  link.click();
}

function attachCanvasInteractions() {
  const c = canvas();
  c.style.cursor = 'grab';

  c.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastX = e.offsetX;
    lastY = e.offsetY;
    c.style.cursor = 'grabbing';
  });
  window.addEventListener('mouseup', () => {
    isDragging = false;
    canvas().style.cursor = 'grab';
  });
  c.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.offsetX - lastX;
    const dy = e.offsetY - lastY;
    panX += dx;
    panY += dy;
    lastX = e.offsetX;
    lastY = e.offsetY;
    drawGraph();
  });
  c.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (e.deltaY < 0) zoomIn();
    else zoomOut();
  }, { passive: false });
}

// ---- POLITIQUES ÉCONOMIQUES AVEC ANIMATION ----
function applyPolicy(policyId) {
  const model = models[currentModel];
  const policy = model.policies.find(p => p.id === policyId);
  
  if (!policy) return;
  
  const targetValue = modelParams[policy.param] + policy.change;
  const min = model.params.find(p => p.id === policy.param).min;
  const max = model.params.find(p => p.id === policy.param).max;
  
  // S'assurer que la valeur reste dans les limites
  const clampedValue = Math.max(min, Math.min(max, targetValue));
  
  gsap.to(modelParams, { 
    [policy.param]: clampedValue, 
    duration: 1, 
    onUpdate: updateAfterAnim 
  });
}

function animateGraph() {
  // Appliquer une animation par défaut selon le modèle
  if (currentModel === 'islm' || currentModel === 'islm-bp') {
    applyPolicy('budget_exp');
  } else {
    applyPolicy('capital_increase');
  }
}

function updateAfterAnim() {
  solveModel();
  drawGraph();
  const sliders = document.querySelectorAll('input[type="range"]');
  sliders.forEach(sl => {
    const id = sl.id.replace('slider-', '');
    if (modelParams[id] !== undefined) {
      sl.value = modelParams[id];
      document.getElementById(`slider-val-${id}`).textContent = modelParams[id];
    }
  });
}

// ---- EXPORT LATEX ----
function exportLatex() {
  const now = new Date().toISOString().slice(0, 10);
  const model = models[currentModel];

  const num = (x, d = 3) => (typeof x === 'number' ? x.toFixed(d) : x);

  let body = '';
  body += '\\section*{Modèle sélectionné: ' + model.name.replaceAll('&', '\\&') + '}\n';
  body += '\\subsection*{Équations}\n\\begin{align*}\n';
  model.equations.forEach(eq => { body += eq.latex + '\\\\\n'; });
  body += '\\end{align*}\n';

  body += '\\subsection*{Paramètres}\n\\begin{tabular}{ll}\\hline\nParamètre & Valeur\\\\\\hline\n';
  model.params.forEach(p => {
    body += `${p.label.replaceAll('&', '\\&')} & ${num(modelParams[p.id], 4)}\\\\\n`;
  });
  body += '\\hline\\end{tabular}\n';

  body += '\\subsection*{Résultats}\n';
  if (currentModel === 'islm' || currentModel === 'islm-bp') {
    body += `Y^{*} = ${num(solution?.Y)}\\,,\\quad r^{*} = ${num(solution?.r)}\\%\\\\\n`;
    body += `C = ${num(solution?.C)}\\,,\\quad I = ${num(solution?.I)}\\\\\n`;
    if (currentModel === 'islm-bp') {
      body += `NX = ${num(solution?.NX)}\\,,\\quad BP = ${num(solution?.BP)}\\\\\n`;
    }
  } else {
    body += `Y = ${num(solution?.Y)}\\,,\\quad w = ${num(solution?.w)}\\,,\\quad r = ${num(solution?.r)}\\\\\n`;
    body += `C = ${num(solution?.C)}\\,,\\quad I = ${num(solution?.I)}\\\\\n`;
  }

  body += '\\subsection*{Multiplicateurs / Élasticités}\n';
  if (currentModel === 'islm') {
    body += `\\partial Y/\\partial G = ${num(multipliers.multG)}\\,,\\; \\partial Y/\\partial T = ${num(multipliers.multT)}\\,,\\; \\partial Y/\\partial M = ${num(multipliers.multM)}.\\smallskip{}\n`;
  } else if (currentModel === 'islm-bp') {
    body += `\\partial Y/\\partial G = ${num(multipliers.multG)}\\,,\\; \\partial Y/\\partial M = ${num(multipliers.multM)}\\,,\\; \\partial Y/\\partial NX_0 = ${num(multipliers.multNX)}.\\smallskip{}\n`;
  } else {
    body += `\\varepsilon(Y,K) = ${num(multipliers.elastY_K)}\\,,\\; \\varepsilon(Y,L) = ${num(multipliers.elastY_L)}.\\smallskip{}\n`;
  }

  const tex = `
\\documentclass[11pt,a4paper]{article}
\\usepackage[margin=2.5cm]{geometry}
\\usepackage{amsmath,amssymb}
\\usepackage{ifthen}
\\usepackage{iftex}
\\IfFileExists{EBGaramond.sty}{\\usepackage{EBGaramond}}{\\usepackage{mathpazo}}
\\usepackage[T1]{fontenc}
\\usepackage[utf8]{inputenc}
\\title{Export automatique — Modèles macroéconomiques}
\\author{Ramanambonona Ambinintsoa}
\\date{${now}}
\\begin{document}
\\maketitle
${body}
\\end{document}
`.trim();

  const blob = new Blob([tex], { type: 'text/x-tex' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `macro_${currentModel}.tex`;
  a.click();
  URL.revokeObjectURL(url);
}

// ---- BOUTONS UI reliés aux fonctions ----
window.zoomIn = zoomIn;
window.zoomOut = zoomOut;
window.resetZoom = resetZoom;
window.downloadCanvas = downloadCanvas;
window.exportLatex = exportLatex;
window.animateGraph = animateGraph;
window.applyPolicy = applyPolicy;

// ---- INIT ----
function initialSetup() {
  if (window.gsap) {
    gsap.from('.macro-title', { y: 10, opacity: 0, duration: 0.6, ease: 'power2.out' });
    gsap.from('.tab-navigation', { y: 8, opacity: 0, duration: 0.5, delay: 0.1 });
  }
  updateModelDisplay();
  attachCanvasInteractions();
  solveModel();
}

document.addEventListener('DOMContentLoaded', initialSetup);
</script>
