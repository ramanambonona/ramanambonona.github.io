<script>
'use strict';

// ---- ÉTAT GLOBAL ----
let currentModel = 'islm';
let modelParams = {};
let initialParams = {};
let solution = null;
let initialSolution = null;
let multipliers = {};

let zoomLevel = 1;
let panX = 0, panY = 0;
let isDragging = false, lastX = 0, lastY = 0;

const canvas = () => document.getElementById('canvas');
const ctx = () => canvas().getContext('2d');

// Fonction pour stocker les fonctions des courbes initiales
let initialCurves = {
    islm: { is_r: null, lm_r: null },
    'islm-bp': { is_r: null, lm_r: null, bp_r: null },
    megc: { Y_of_K: null }
};

// ---- DÉFINITION DES MODÈLES (inchangée, reprise du fichier) ----
const models = {
  islm: {
    name: 'Modèle IS-LM',
    equations: [
      { latex: 'Y = C(Y - T) + I(r) + G', desc: 'Courbe IS (équilibre du marché des biens)' },
      { latex: 'C = c_0 + c_1(Y - T)', desc: 'Fonction de consommation' },
      { latex: 'I = I_0 - br', desc: "Fonction d'investissement" },
      { latex: '\\frac{M}{P} = L(Y, r) = kY - hr', desc: 'Courbe LM (équilibre monétaire)' },
    ],
    explanation:
      "Le modèle IS-LM représente l'équilibre simultané sur le marché des biens (IS) et le marché monétaire (LM).",
    params: [
      { id: 'c0', label: 'Consommation autonome (c₀)', default: 100, min: 0, max: 500 },
      { id: 'c1', label: 'Propension marginale à consommer (c₁)', default: 0.8, min: 0, max: 1, step: 0.01 },
      { id: 'b',  label: "Sensibilité de l'investissement au taux (b)", default: 50, min: 10, max: 200 },
      { id: 'I0', label: 'Investissement autonome (I₀)', default: 150, min: 0, max: 500 },
      { id: 'G',  label: 'Dépenses publiques (G)', default: 200, min: 0, max: 500 },
      { id: 'T',  label: 'Taxes (T)', default: 100, min: 0, max: 500 },
      { id: 'M',  label: 'Offre de monnaie (M)', default: 1000, min: 100, max: 3000 },
      { id: 'P',  label: 'Niveau des prix (P)', default: 1, min: 0.1, max: 5, step: 0.1 },
      { id: 'k',  label: 'Sensibilité de la demande de monnaie au revenu (k)', default: 0.5, min: 0.1, max: 1, step: 0.01 },
      { id: 'h',  label: 'Sensibilité de la demande de monnaie au taux (h)', default: 100, min: 10, max: 500 },
    ],
    sliders: [
      { id: 'G', label: 'Dépenses publiques (G)', desc: 'Politique budgétaire expansionniste → IS → droite' },
      { id: 'M', label: 'Offre de monnaie (M)', desc: 'Politique monétaire expansionniste → LM → bas' },
      { id: 'T', label: 'Taxes (T)', desc: 'Hausse des taxes → IS → gauche' },
    ],
  },
  'islm-bp': {
    name: 'Modèle IS-LM-BP',
    equations: [
      { latex: 'Y = C(Y - T) + I(r) + G + NX(Y, e)', desc: 'IS en économie ouverte' },
      { latex: 'NX = NX_0 - mY', desc: 'Exportations nettes' },
      { latex: '\\frac{M}{P} = L(Y, r) = kY - hr', desc: 'LM' },
      { latex: 'BP: NX(Y) + KA(r - r^*) = 0', desc: 'Balance des paiements' },
      { latex: 'KA = n(r - r^*)', desc: 'Compte de capital' },
    ],
    explanation:
      "Le modèle IS-LM-BP étend IS-LM à l'économie ouverte et introduit la condition d'équilibre externe (BP).",
    params: [
      { id: 'c0', label: 'Consommation autonome (c₀)', default: 100, min: 0, max: 500 },
      { id: 'c1', label: 'Propension marginale à consommer (c₁)', default: 0.8, min: 0, max: 1, step: 0.01 },
      { id: 'b',  label: 'Sensibilité de l’investissement (b)', default: 50, min: 10, max: 200 },
      { id: 'I0', label: 'Investissement autonome (I₀)', default: 150, min: 0, max: 500 },
      { id: 'G',  label: 'Dépenses publiques (G)', default: 200, min: 0, max: 500 },
      { id: 'T',  label: 'Taxes (T)', default: 100, min: 0, max: 500 },
      { id: 'M',  label: 'Offre de monnaie (M)', default: 1000, min: 100, max: 3000 },
      { id: 'P',  label: 'Niveau des prix (P)', default: 1, min: 0.1, max: 5, step: 0.1 },
      { id: 'k',  label: 'Sensibilité de la demande de monnaie au revenu (k)', default: 0.5, min: 0.1, max: 1, step: 0.01 },
      { id: 'h',  label: 'Sensibilité de la demande de monnaie au taux (h)', default: 100, min: 10, max: 500 },
      { id: 'm',  label: 'Propension marginale à importer (m)', default: 0.1, min: 0, max: 0.5, step: 0.01 },
      { id: 'NX0',label: 'Exportations nettes autonomes (NX₀)', default: 50, min: -200, max: 200 },
      { id: 'n',  label: 'Mobilité des capitaux (n)', default: 100, min: 10, max: 500 },
      { id: 'r_star', label: "Taux d'intérêt étranger (r*)", default: 5, min: 0, max: 20, step: 0.1 },
    ],
    sliders: [
      { id: 'G',   label: 'Dépenses publiques (G)', desc: 'Budget ↑ → IS droite → risque excédent BP' },
      { id: 'M',   label: 'Offre de monnaie (M)',   desc: 'Monétaire ↑ → LM bas → risque déficit BP' },
      { id: 'NX0', label: 'Exportations nettes (NX₀)', desc: 'Choc externe → IS & BP → droite/gauche' },
    ],
  },
  megc: {
    name: "MEGC - Modèle d'Équilibre Général Calculable",
    equations: [
      { latex: 'Y = F(K, L) = K^\\alpha L^{1-\\alpha}', desc: 'Cobb-Douglas' },
      { latex: 'C + I = Y', desc: 'Ressources-emplois' },
      { latex: 'w = (1-\\alpha) Y/L', desc: 'PM du travail', isFactorPrice: true },
      { latex: 'r = \\alpha Y/K', desc: 'PM du capital', isFactorPrice: true },
      { latex: 'C = (1-s)Y', desc: 'Consommation' },
      { latex: 'I = sY', desc: 'Épargne = Investissement' },
    ],
    explanation:
      "Le MEGC détermine simultanément la production, les prix des facteurs et l'allocation Y = C + I.",
    params: [
      { id: 'K',     label: 'Stock de capital (K)', default: 100, min: 10, max: 500 },
      { id: 'L',     label: 'Offre de travail (L)', default: 100, min: 10, max: 500 },
      { id: 'alpha', label: 'Part du capital (α)',  default: 0.3, min: 0.1, max: 0.9, step: 0.01 },
      { id: 's',     label: "Taux d'épargne (s)",   default: 0.2, min: 0,   max: 0.8, step: 0.01 },
    ],
    sliders: [
      { id: 'K', label: 'Stock de capital (K)', desc: 'Accumulation → Y ↑' },
      { id: 'L', label: 'Offre de travail (L)', desc: 'Population active → Y ↑' },
      { id: 's', label: "Taux d'épargne (s)",    desc: 'Plus d’I → croissance future' },
    ],
  },
};

// ---- ONGLET / UI ----
function openTab(tabName, btnEl) {
  const tabs = document.querySelectorAll('.tab-content');
  const btns = document.querySelectorAll('.tab-btn');
  tabs.forEach(t => t.classList.remove('active'));
  btns.forEach(b => b.classList.remove('active'));
  const target = document.getElementById(`${tabName}-tab`);
  if (target) target.classList.add('active');
  if (btnEl) btnEl.classList.add('active');
}

function updateModelDisplay() {
  currentModel = document.getElementById('model-type').value;
  const model = models[currentModel];
  const display = document.getElementById('model-display');

  let html = `<h3>${model.name}</h3>`;
  html += '<div class="equation-block"><h4 style="color:#2a2a2a;margin-bottom:15px;">Équations du modèle</h4>';
  model.equations.forEach(eq => {
    html += `<div style="margin:15px 0;"><div>$$${eq.latex}$$</div><div style="color:#5a5a5a;font-size:.9rem;margin-top:5px;font-style:italic;">${eq.desc}</div></div>`;
  });
  html += '</div>';
  html += `<div class="explanation"><strong>Explication pédagogique:</strong><br>${model.explanation}</div>`;
  display.innerHTML = html;
  if (window.renderMathInElement) renderMathInElement(display);

  solution = null;
  initialSolution = null;

  updateParamsDisplay();
  updateSliders();       // prépare les sliders pour l’onglet Affichage
  updateLegend();        // légende cohérente avec le modèle
  drawGraph();           // trace un état neutre si pas encore de solution
}

function updateParamsDisplay() {
  const model = models[currentModel];
  const container = document.getElementById('params-content');

  let html = '<table class="param-table"><thead><tr><th>Paramètre</th><th>Valeur</th></tr></thead><tbody>';
  model.params.forEach(p => {
    const step = p.step || 1;
    html += `<tr>
      <th>${p.label}</th>
      <td><input type="number" id="param-${p.id}" value="${p.default}" min="${p.min}" max="${p.max}" step="${step}"></td>
    </tr>`;
    modelParams[p.id] = p.default;
  });
  html += '</tbody></table>';
  container.innerHTML = html;

  model.params.forEach(p => {
    const el = document.getElementById(`param-${p.id}`);
    el.addEventListener('input', (e) => {
      modelParams[p.id] = parseFloat(e.target.value);
    });
  });
}

function solveModel() {
  const model = models[currentModel];
  
  // synchroniser paramètres depuis inputs
  model.params.forEach(p => {
    const value = parseFloat(document.getElementById(`param-${p.id}`).value);
    modelParams[p.id] = value;
  });

  if (currentModel === 'islm') solveISLM();
  else if (currentModel === 'islm-bp') solveISLMBP();
  else if (currentModel === 'megc') solveMEGC();
  
  // Stocker l'état initial lors du premier "solve"
  if (!initialSolution) {
      initialParams = JSON.parse(JSON.stringify(modelParams));
      initialSolution = JSON.parse(JSON.stringify(solution));
      storeInitialCurves(); // Stocker les fonctions des courbes initiales
  }

  displayDetailedResults();
  updateLegend();
  drawGraph();

  // activer l’onglet Résolution
  openTab('solve', document.querySelectorAll('.tab-btn')[2]);
}

// ---- RÉSOLUTION ----
function solveISLM(params = modelParams) {
  const { c0, c1, b, I0, G, T, M, P, k, h } = params;

  const denom_IS = 1 - c1;
  const denom = h * (1 - c1) + k * b;

  const Y_star = (h * (c0 + I0 - c1 * T + G) + b * (M / P)) / denom;
  const r_star = (k * (c0 + I0 - c1 * T + G) - (1 - c1) * (M / P)) / denom;

  const C = c0 + c1 * (Y_star - T);
  const I = I0 - b * r_star;

  if (params === modelParams) {
      solution = { Y: Y_star, r: r_star, C, I };
      multipliers = {
          multG: h / denom,
          multT: -c1 * h / denom,
          multM: b / (P * denom),
          multG_simple: 1 / denom_IS,
      };
  }
  
  // Retourner les fonctions des courbes pour le tracé
  const is_r = (Y) => (c0 + I0 - c1*T + G - (1 - c1)*Y) / b;
  const lm_r = (Y) => (k/h)*Y - (M/(P*h));
  return { is_r, lm_r };
}

function solveISLMBP(params = modelParams) {
  const { c0, c1, b, I0, G, T, M, P, k, h, m, NX0, n, r_star } = params;
  const denom = h * (1 - c1 + m) + k * b;

  const Y_eq = (h * (c0 + I0 - c1 * T + G + NX0 - b * r_star) + b * (M / P)) / denom;
  const r_eq = (k * (c0 + I0 - c1 * T + G + NX0) - (1 - c1 + m) * (M / P) + h * r_star) / denom;

  const NX = NX0 - m * Y_eq;
  const C  = c0 + c1 * (Y_eq - T);
  const I  = I0 - b * r_eq;
  const BP = NX + n * (r_eq - r_star);

  if (params === modelParams) {
      solution = { Y: Y_eq, r: r_eq, NX, C, I, BP };
      multipliers = {
          multG:  h / denom,
          multM:  b / (P * denom),
          multNX: h / denom,
      };
  }
  
  // Retourner les fonctions des courbes pour le tracé
  const is_r = (Y) => (c0 + I0 - c1*T + G + NX0 - (1 - c1 + m)*Y) / b;
  const lm_r = (Y) => (k/h)*Y - (M/(P*h));
  const bp_r = (Y) => r_star + (m*Y - NX0)/n;
  return { is_r, lm_r, bp_r };
}

function solveMEGC(params = modelParams) {
  const { K, L, alpha, s } = params;
  const Y = Math.pow(K, alpha) * Math.pow(L, 1 - alpha);
  const w = (1 - alpha) * Y / L;
  const r = alpha * Y / K;
  const C = (1 - s) * Y;
  const I = s * Y;
  const prodK = Y / K;
  const prodL = Y / L;

  if (params === modelParams) {
      solution = { Y, w, r, C, I, K, L, prodK, prodL };
      multipliers = {
          elastY_K: alpha,
          elastY_L: 1 - alpha,
          elastY_s: 0,
      };
  }

  // Retourner la fonction de production pour le tracé
  const Y_of_K = (K_val) => Math.pow(K_val, alpha) * Math.pow(L, 1-alpha);
  return { Y_of_K };
}

// Nouvelle fonction pour stocker les fonctions des courbes initiales
function storeInitialCurves() {
    if (currentModel === 'islm') {
        initialCurves.islm = solveISLM(initialParams);
    } else if (currentModel === 'islm-bp') {
        initialCurves['islm-bp'] = solveISLMBP(initialParams);
    } else if (currentModel === 'megc') {
        initialCurves.megc = solveMEGC(initialParams);
    }
}

// ---- DESSIN CANVAS ----
function clearCanvas() {
  const c = canvas(); const context = ctx();
  context.save();
  context.setTransform(1,0,0,1,0,0);
  context.clearRect(0, 0, c.width, c.height);
  context.restore();
}

function drawAxes(context, xMin, xMax, yMin, yMax, xLabel, yLabel) { // Ajout des labels
  // repère marge
  const m = 50;
  const W = canvas().width;
  const H = canvas().height;
  context.strokeStyle = '#BBBBBB';
  context.lineWidth = 1;

  // axes
  context.beginPath();
  context.moveTo(m + panX, (H - m) + panY);
  context.lineTo((W - m) + panX, (H - m) + panY); // Axe X
  context.moveTo(m + panX, m + panY);
  context.lineTo(m + panX, (H - m) + panY); // Axe Y
  context.stroke();

  // Titres des axes
  context.fillStyle = '#1a1a1a';
  context.font = 'bold 14px sans-serif';
  context.fillText(xLabel, W - m + panX - 10, H - m + panY + 5); // Label X
  context.fillText(yLabel, m + panX - 5, m + panY - 15); // Label Y

  // graduations (4 ticks)
  const ticks = 4;
  context.fillStyle = '#666';
  context.font = '12px sans-serif';
  for (let i=0; i<=ticks; i++) {
    const x = m + (i/ticks) * (W - 2*m);
    const y = (H - m);
    const vx = xMin + (i/ticks)*(xMax-xMin);
    context.fillText(vx.toFixed(0), x-8 + panX, y+20 + panY); // Graduation X
  }
  for (let j=0; j<=ticks; j++) {
    const y = (H - m) - (j/ticks)*(H - 2*m);
    const vy = yMin + (j/ticks)*(yMax-yMin);
    context.fillText(vy.toFixed(0), m-40 + panX, y+4 + panY); // Graduation Y
  }
}

function xMap(V, vMin, vMax) {
  const m = 50;
  const W = canvas().width - 2*m;
  return (m + ((V - vMin)/(vMax - vMin))*W);
}
function yMap(V, vMin, vMax) {
  const m = 50;
  const H = canvas().height - 2*m;
  return ((canvas().height - m) - ((V - vMin)/(vMax - vMin))*H);
}

// Fonction utilitaire pour tracer une ligne
function drawLine(context, points, color='#000', width=2, dotted=false) {
  context.strokeStyle = color;
  context.lineWidth = width;
  if (dotted) context.setLineDash([5, 5]);
  else context.setLineDash([]);
  
  context.beginPath();
  points.forEach((p,i) => {
    if (i===0) context.moveTo(p[0] + panX, p[1] + panY);
    else context.lineTo(p[0] + panX, p[1] + panY);
  });
  context.stroke();
  context.setLineDash([]); // Reset dash for next draws
}

// Nouvelle fonction utilitaire pour tracer un point et les pointillés vers les axes
function drawPoint(context, x, y, color='#777', isInitial=false) {
  context.fillStyle = color;
  context.beginPath();
  context.arc(x + panX, y + panY, 4, 0, 2*Math.PI);
  context.fill();

  if (solution && solution.Y !== undefined) {
      // Pointillés vers les axes
      context.strokeStyle = isInitial ? '#AAAAAA' : '#000000';
      context.lineWidth = 1;
      context.setLineDash([2, 4]);

      // Vers l'axe X
      context.beginPath();
      context.moveTo(x + panX, y + panY);
      context.lineTo(x + panX, (canvas().height - 50) + panY);
      context.stroke();

      // Vers l'axe Y
      context.beginPath();
      context.moveTo(x + panX, y + panY);
      context.lineTo(50 + panX, y + panY);
      context.stroke();
      
      context.setLineDash([]); // Reset dash
  }
}

function drawGraph() {
  const c = canvas(); if (!c) return;
  const context = ctx();
  clearCanvas();

  // zoom/transform
  context.save();
  context.translate((c.width/2)*(1-zoomLevel), (c.height/2)*(1-zoomLevel));
  context.scale(zoomLevel, zoomLevel);
  
  // Constantes de couleur pour IS-LM
  const is_color = '#E91E63'; 
  const lm_color = '#2196F3'; 
  const bp_color = '#4CAF50'; 
  const initial_point_color = '#707070';
  const current_point_color = '#000000';

  if (currentModel === 'islm' || currentModel === 'islm-bp') {
    // Axes: X = Y, Y = r (Taux d'intérêt)
    
    // Si pas encore de solution, on utilise les valeurs par défaut
    const Ystar = solution?.Y ?? 1000;
    const rstar = solution?.r ?? 5;
    const Yinitial = initialSolution?.Y ?? Ystar;
    const rInitial = initialSolution?.r ?? rstar;

    // Définir la plage de tracé autour de l'équilibre
    const Yavg = (Ystar + Yinitial) / 2;
    const rAvg = (rstar + rInitial) / 2;
    
    // Plage ajustée pour ne pas être trop longue (0.5x à 1.5x la valeur moyenne)
    const xMin = Math.max(0, 0.5 * Yavg);
    const xMax = 1.5 * Yavg;
    const yMin = Math.max(0, 0.5 * rAvg);
    const yMax = 1.5 * rAvg;

    drawAxes(context, xMin, xMax, yMin, yMax, 'Revenu (Y)', 'Taux (r)');

    const N = 100; // Nombre de points pour tracer les lignes
    
    // --- Tracé des COURBES INITIALES (Pointillés) ---
    if (initialSolution && (initialSolution.Y !== solution.Y || initialSolution.r !== solution.r)) {
        const initialFns = currentModel === 'islm' ? solveISLM(initialParams) : solveISLMBP(initialParams);
        
        const ptsIS_initial = [];
        const ptsLM_initial = [];
        const ptsBP_initial = [];

        for (let i=0;i<=N;i++){
            const Y = xMin + (i/N)*(xMax-xMin);
            // Vérification de la plage r pour éviter les valeurs extrêmes
            const rIS = initialFns.is_r(Y);
            if (rIS >= yMin && rIS <= yMax) ptsIS_initial.push([xMap(Y,xMin,xMax), yMap(rIS, yMin,yMax)]);

            const rLM = initialFns.lm_r(Y);
            if (rLM >= yMin && rLM <= yMax) ptsLM_initial.push([xMap(Y,xMin,xMax), yMap(rLM, yMin,yMax)]);
            
            if (currentModel === 'islm-bp') {
                const rBP = initialFns.bp_r(Y);
                if (rBP >= yMin && rBP <= yMax) ptsBP_initial.push([xMap(Y,xMin,xMax), yMap(rBP, yMin,yMax)]);
            }
        }
        
        drawLine(context, ptsIS_initial, is_color, 2, true);
        drawLine(context, ptsLM_initial, lm_color, 2, true);
        if (currentModel === 'islm-bp') drawLine(context, ptsBP_initial, bp_color, 2, true);

        // Point d'équilibre initial
        const xE_initial = xMap(initialSolution.Y, xMin, xMax);
        const yE_initial = yMap(initialSolution.r, yMin, yMax);
        drawPoint(context, xE_initial, yE_initial, initial_point_color, true);
    }
    
    // --- Tracé des COURBES COURANTES (Pleines) ---
    const currentFns = currentModel === 'islm' ? solveISLM(modelParams) : solveISLMBP(modelParams);

    const ptsIS = [];
    const ptsLM = [];
    const ptsBP = [];
    for (let i=0;i<=N;i++){
        const Y = xMin + (i/N)*(xMax-xMin);
        
        const rIS = currentFns.is_r(Y);
        if (rIS >= yMin && rIS <= yMax) ptsIS.push([xMap(Y,xMin,xMax), yMap(rIS, yMin,yMax)]);

        const rLM = currentFns.lm_r(Y);
        if (rLM >= yMin && rLM <= yMax) ptsLM.push([xMap(Y,xMin,xMax), yMap(rLM, yMin,yMax)]);

        if (currentModel === 'islm-bp') {
            const rBP = currentFns.bp_r(Y);
            if (rBP >= yMin && rBP <= yMax) ptsBP.push([xMap(Y,xMin,xMax), yMap(rBP, yMin,yMax)]);
        }
    }
    
    // On dessine en s'assurant que les points sont valides (on n'a pas inclus cette vérification dans l'outil de base)
    drawLine(context, ptsIS, is_color, 2);
    drawLine(context, ptsLM, lm_color, 2);
    if (currentModel === 'islm-bp') drawLine(context, ptsBP, bp_color, 2);

    // Nouvel Équilibre
    if (solution) {
      const xE = xMap(solution.Y, xMin, xMax);
      const yE = yMap(solution.r, yMin, yMax);
      drawPoint(context, xE, yE, current_point_color);
    }

  } else {
    // MEGC : Y = F(K, L)
    
    const Kstar = modelParams.K;
    const Ystar = solution?.Y ?? Math.pow(Kstar, models.megc.params.find(p=>p.id==='alpha').default) * Math.pow(modelParams.L, 1-models.megc.params.find(p=>p.id==='alpha').default);

    const Kinitial = initialSolution?.K ?? Kstar;
    const Yinitial = initialSolution?.Y ?? Ystar;

    const Kavg = (Kstar + Kinitial) / 2;
    const Yavg = (Ystar + Yinitial) / 2;

    const xMin = Math.max(1, 0.5*Kavg);
    const xMax = 1.5*Kavg;
    const yMin = 0;
    const yMax = 1.5*Yavg;

    drawAxes(context, xMin, xMax, yMin, yMax, 'Capital (K)', 'Production (Y)');

    // Courbe de production actuelle
    const Y_of_K = solveMEGC(modelParams).Y_of_K;
    const pts = [];
    const N = 150;
    for (let i=0;i<=N;i++){
      const K = xMin + (i/N)*(xMax-xMin);
      pts.push([xMap(K, xMin,xMax), yMap(Y_of_K(K), yMin,yMax)]);
    }
    drawLine(context, pts, '#000000', 2);
    
    // Point initial
    if (initialSolution && (initialSolution.Y !== solution.Y || initialSolution.K !== solution.K)) {
        const xI = xMap(initialSolution.K, xMin, xMax);
        const yI = yMap(initialSolution.Y, yMin, yMax);
        drawPoint(context, xI, yI, initial_point_color, true);
    }

    // Point courant
    if (solution) {
      drawPoint(context, xMap(solution.K, xMin,xMax), yMap(solution.Y, yMin,yMax), current_point_color);
    }
  }

  context.restore();
}

// ---- ZOOM / PAN & TÉLÉCHARGEMENT (inchangé) ----
function zoomIn(){ zoomLevel = Math.min(3, zoomLevel*1.2); drawGraph(); }
function zoomOut(){ zoomLevel = Math.max(0.4, zoomLevel/1.2); drawGraph(); }
function resetZoom(){ zoomLevel = 1; panX = 0; panY = 0; drawGraph(); }

function downloadCanvas(){
  const link = document.createElement('a');
  link.download = `macro_${currentModel}.png`;
  link.href = canvas().toDataURL('image/png');
  link.click();
}

function attachCanvasInteractions() {
  const c = canvas();
  c.style.cursor = 'grab';

  c.addEventListener('mousedown', (e) => {
    isDragging = true; lastX = e.offsetX; lastY = e.offsetY; c.style.cursor = 'grabbing';
  });
  window.addEventListener('mouseup', () => {
    isDragging = false; canvas().style.cursor = 'grab';
  });
  c.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.offsetX - lastX;
    const dy = e.offsetY - lastY;
    panX += dx; panY += dy;
    lastX = e.offsetX; lastY = e.offsetY;
    drawGraph();
  });
  c.addEventListener('wheel', (e) => {
    e.preventDefault();
    // Zoom/Dezoom en fonction de la position de la souris
    const scaleFactor = 1.1;
    const delta = e.deltaY < 0 ? scaleFactor : 1/scaleFactor;
    
    // Calcul de la position de la souris relative au centre du canvas
    const rect = c.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    // Ajustement pour maintenir le point sous la souris
    panX = (panX - mouseX) * delta + mouseX;
    panY = (panY - mouseY) * delta + mouseY;
    zoomLevel = Math.min(5, Math.max(0.2, zoomLevel * delta)); // Limiter le zoom

    drawGraph();
  }, { passive: false });
}

// ---- EXPORT LATEX (inchangé) ----
function exportLatex(){
  const now = new Date().toISOString().slice(0,10);
  const model = models[currentModel];

  const num = (x, d=3) => (typeof x === 'number' ? x.toFixed(d) : x);

  let body = '';
  // Équations
  body += '\\section*{Modèle sélectionné: ' + model.name.replaceAll('&','\\&') + '}\n';
  body += '\\subsection*{Équations}\n\\begin{align*}\n';
  model.equations.forEach(eq => { body += eq.latex + '\\\\\n'; }); // Correction: \\\\n -> \\\\\n
  body += '\\end{align*}\n';

  // Paramètres
  body += '\\subsection*{Paramètres}\n\\begin{tabular}{ll}\\hline\nParamètre & Valeur\\\\\\hline\n';
  model.params.forEach(p => {
    body += `${p.label.replaceAll('&','\\&')} & ${num(modelParams[p.id], 4)}\\\\\n`;
  });
  body += '\\hline\\end{tabular}\n';

  // Résultats
  body += '\\subsection*{Résultats}\n';
  if (currentModel === 'islm' || currentModel === 'islm-bp') {
    body += `Y^{*} = ${num(solution?.Y)}\\,,\\quad r^{*} = ${num(solution?.r)}\\%\\\\n`;
    body += `C = ${num(solution?.C)}\\,,\\quad I = ${num(solution?.I)}\\\\n`;
    if (currentModel === 'islm-bp') {
      body += `NX = ${num(solution?.NX)}\\,,\\quad BP = ${num(solution?.BP)}\\\\n`;
    }
  } else {
    body += `Y = ${num(solution?.Y)}\\,,\\quad w = ${num(solution?.w)}\\,,\\quad r = ${num(solution?.r)}\\\\n`;
    body += `C = ${num(solution?.C)}\\,,\\quad I = ${num(solution?.I)}\\\\n`;
  }

  // Multiplicateurs
  body += '\\subsection*{Multiplicateurs / Élasticités}\n';
  if (currentModel === 'islm') {
    body += `\\partial Y/\\partial G = ${num(multipliers.multG)}\\,,\\; \\partial Y/\\partial T = ${num(multipliers.multT)}\\,,\\; \\partial Y/\\partial M = ${num(multipliers.multM)}.\\smallskip{}\n`;
  } else if (currentModel === 'islm-bp') {
    body += `\\partial Y/\\partial G = ${num(multipliers.multG)}\\,,\\; \\partial Y/\\partial M = ${num(multipliers.multM)}\\,,\\; \\partial Y/\\partial NX_0 = ${num(multipliers.multNX)}.\\smallskip{}\n`;
  } else {
    body += `\\varepsilon(Y,K) = ${num(multipliers.elastY_K)}\\,,\\; \\varepsilon(Y,L) = ${num(multipliers.elastY_L)}.\\smallskip{}\n`;
  }

  const tex = `
\\documentclass[11pt,a4paper]{article}
\\usepackage[margin=2.5cm]{geometry}
\\usepackage{amsmath,amssymb}
\\usepackage{ifthen}
\\usepackage{iftex}
\\IfFileExists{EBGaramond.sty}{\\usepackage{EBGaramond}}{\\usepackage{mathpazo}}
\\usepackage[T1]{fontenc}
\\usepackage[utf8]{inputenc}
\\title{Export automatique — Modèles macroéconomiques}
\\author{Ramanambonona Ambinintsoa}
\\date{${now}}
\\begin{document}
\\maketitle
${body}
\\end{document}
`.trim();

  const blob = new Blob([tex], {type:'text/x-tex'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `macro_${currentModel}.tex`;
  a.click();
  URL.revokeObjectURL(url);
}

window.zoomIn = zoomIn;
window.zoomOut = zoomOut;
window.resetZoom = resetZoom;
window.downloadCanvas = downloadCanvas;
window.exportLatex = exportLatex;
