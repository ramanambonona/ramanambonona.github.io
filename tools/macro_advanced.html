'use strict';

/* ========= État global & helpers ========= */
let currentModel = 'rbc';
let modelParams = {};
let initialParams = {};
let solution = null;
let initialSolution = null;

let zoomLevel = 1, panX = 0, panY = 0;
let isDragging = false, lastX = 0, lastY = 0;

const canvas = () => document.getElementById('canvas');
const ctx = () => canvas().getContext('2d');

/* ========= Helper KaTeX amélioré ========= */
function renderAllMath(scopeEl){
  if (!window.renderMathInElement) {
    console.warn('KaTeX auto-render non disponible');
    return;
  }
  
  try {
    renderMathInElement(scopeEl, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "\\[", right: "\\]", display: true},
        {left: "\\(", right: "\\)", display: false},
        {left: "$",  right: "$",  display: false}
      ],
      throwOnError: false,
      errorColor: "#cc0000"
    });
  } catch (error) {
    console.error('Erreur KaTeX:', error);
  }
}

/* ========= Onglets ========= */
function openTab(tabName, btnEl) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const target = document.getElementById(`${tabName}-tab`);
  if (target) target.classList.add('active');
  if (btnEl) btnEl.classList.add('active');
}

/* ========= Définition des modèles CORRIGÉS ========= */
const models = {
  rbc: {
    name: 'RBC — cycle réel avec choc TFP (AR(1))',
    equations: [
      { latex: 'Y_t = A_t K_t^{\\alpha}', desc: 'Production (travail normalisé à 1)' },
      { latex: 'K_{t+1} = I_t + (1-\\delta)K_t', desc: 'Accumulation du capital' },
      { latex: 'C_t = Y_t - I_t', desc: 'Ressources' },
      { latex: 'A_t = \\bar{A} e^{z_t},\\quad z_t = \\rho_A z_{t-1} + \\varepsilon_t', desc: 'TFP AR(1)' },
      { latex: '\\alpha A (K^*)^{\\alpha-1} = \\frac{1}{\\beta} - (1-\\delta)', desc: 'État stationnaire (Euler)' }
    ],
    explanation:
      "On approxime la politique optimale par un taux d'investissement constant égal à l'investissement stationnaire \\( i^* = \\delta K^* \\), d'où \\( s^* = i^*/Y^* \\) ; le choc TFP suit un AR(1).",
    params: [
      { id:'alpha', label:'\\(\\alpha\\) (part du capital)', default:0.33, min:0.1, max:0.6, step:0.01 },
      { id:'delta', label:'\\(\\delta\\) (dépréciation)', default:0.08, min:0.01, max:0.2, step:0.01 },
      { id:'beta',  label:'\\(\\beta\\) (escompte)', default:0.96, min:0.85, max:0.995, step:0.001 },
      { id:'Abar',  label:'\\(\\bar A\\) (niveau TFP de base)', default:1.0, min:0.5, max:2.0, step:0.01 },
      { id:'rhoA',  label:'\\(\\rho_A\\) (persistance TFP)', default:0.9, min:0.0, max:0.99, step:0.01 },
      { id:'epsA',  label:'Choc TFP (log, %)', default:1.0, min:0.0, max:10.0, step:0.1 },
      { id:'T',     label:'Horizon (T périodes)', default:80, min:20, max:300, step:1 },
      { id:'k0',    label:'\\(K_0\\) (capital initial)', default:1.0, min:0.1, max:5.0, step:0.1 }
    ],
    sliders: [
      { id:'epsA', label:'Amplitude du choc TFP (log, %)', desc:'Un cran = un choc ponctuel sur A au début' },
      { id:'rhoA', label:'Persistance \\(\\rho_A\\)', desc:'Plus \\(\\rho_A\\) est élevé, plus le choc persiste' },
      { id:'alpha', label:'\\(\\alpha\\) (part du capital)', desc:'Affecte \(k^*\) via l\'Euler et l\'ampleur des réponses' }
    ]
  },

  ak: {
    name: 'Croissance endogène (AK)',
    equations: [
      { latex: 'Y_t = A K_t', desc: 'Technologie de type AK' },
      { latex: 'K_{t+1} = s Y_t + (1-\\delta) K_t', desc: 'Accumulation' },
      { latex: 'C_t = (1-s) Y_t', desc: 'Consommation' },
      { latex: 'g \\approx sA - \\delta', desc: 'Taux de croissance de long terme' }
    ],
    explanation:
      "Le modèle AK génère une croissance soutenue si \\( sA > \\delta \\). On simule les trajectoires (K, Y, C) et on affiche les % écarts au niveau initial.",
    params: [
      { id:'A',   label:'A (productivité)', default:0.15, min:0.01, max:0.6, step:0.01 },
      { id:'s',   label:'s (taux d\'épargne)', default:0.25, min:0.0, max:0.8, step:0.01 },
      { id:'delta', label:'\\(\\delta\\) (dépréciation)', default:0.05, min:0.0, max:0.2, step:0.01 },
      { id:'T',   label:'Horizon (T périodes)', default:80, min:20, max:300, step:1 },
      { id:'k0',  label:'\\(K_0\\) (capital initial)', default:1.0, min:0.1, max:5.0, step:0.1 },
      { id:'shockA', label:'Choc ponctuel A (%)', default:0.0, min:-10, max:10, step:0.5 }
    ],
    sliders: [
      { id:'s', label:'Taux d\'épargne \\(s\\)', desc:'Plus \\(s\\) est grand, plus la croissance AK est forte' },
      { id:'A', label:'Productivité \\(A\\)', desc:'Accroît directement le rendement du capital' },
      { id:'shockA', label:'Choc \\(A\\) (%)', desc:'Impulsion ponctuelle en \\(t=1\\) sur \\(A\\)' }
    ]
  },

  adaptive: {
    name: 'Anticipations adaptatives (Phillips simple)',
    equations: [
      { latex: '\\pi_t = \\pi^e_t + \\gamma x_t + u_t', desc:'Inflation et écart de production' },
      { latex: '\\pi^e_{t+1} = \\pi^e_t + \\lambda(\\pi_t - \\pi^e_t)', desc:'Mise à jour adaptative' },
      { latex: 'x_t = \\rho_x x_{t-1} + \\varepsilon_t', desc:'Processus de l\'écart de production' }
    ],
    explanation:
      "Les agents ajustent leurs anticipations d'inflation en comblant une fraction de l'erreur passée. On trace \\(\\pi_t, \\pi^e_t, x_t\\).",
    params: [
      { id:'gamma',  label:'\\(\\gamma\\) (pente PC)', default:0.5, min:0.0, max:2.0, step:0.05 },
      { id:'lambda', label:'\\(\\lambda\\) (vitesse d\'adaptation)', default:0.4, min:0.0, max:1.0, step:0.05 },
      { id:'rho_x',  label:'\\(\\rho_x\\) (persistance écart)', default:0.6, min:0.0, max:0.99, step:0.01 },
      { id:'eps_x',  label:'Choc sur \\(x\\) (pts)', default:1.0, min:-5.0, max:5.0, step:0.1 },
      { id:'pi_e0',  label:'\\(\\pi^e_0\\) (pts annuels)', default:5.0, min:-10, max:20, step:0.1 },
      { id:'T',      label:'Horizon (T)', default:80, min:20, max:300, step:1 }
    ],
    sliders: [
      { id:'lambda', label:'Vitesse \\(\\lambda\\)', desc:'Plus \\(\\lambda\\) est élevé, plus l\'anticipation colle vite à \\(\\pi\\)' },
      { id:'gamma',  label:'Pente \\(\\gamma\\)', desc:'Sensibilité de \\(\\pi\\) à l\'écart de production' },
      { id:'eps_x',  label:'Choc \\(x\\) (pts)', desc:'Impulsion initiale sur l\'écart de production' }
    ]
  },

  rational: {
    name: 'Anticipations rationnelles (NKPC prospective)',
    equations: [
      { latex: '\\pi_t = \\beta E_t\\pi_{t+1} + \\kappa x_t', desc:'Courbe de Phillips néo-keynésienne' },
      { latex: 'x_t = \\rho_x x_{t-1} + \\varepsilon_t', desc:'Processus de l\'écart de production' },
      { latex: '\\pi_t = \\kappa \\sum_{j\\ge 0} \\beta^j E_t x_{t+j}', desc:'Solution prospective (horizon fini en code)' }
    ],
    explanation:
      "On calcule \\(\\pi_t\\) par somme prospective finie, en supposant \\(x_t\\) AR(1) et horizon \\(T\\) (anticipations rationnelles de parfaite prévision sur \\(T\\)).",
    params: [
      { id:'beta',  label:'\\(\\beta\\) (escompte)', default:0.99, min:0.9, max:0.999, step:0.001 },
      { id:'kappa', label:'\\(\\kappa\\) (pente NKPC)', default:0.1, min:0.01, max:1.0, step:0.01 },
      { id:'rho_x', label:'\\(\\rho_x\\) (persistance écart)', default:0.6, min:0.0, max:0.99, step:0.01 },
      { id:'eps_x', label:'Choc sur \\(x\\) (pts)', default:1.0, min:-5.0, max:5.0, step:0.1 },
      { id:'T',     label:'Horizon (T)', default:80, min:20, max:300, step:1 }
    ],
    sliders: [
      { id:'beta',  label:'\\(\\beta\\)', desc:'Poids des anticipations futures' },
      { id:'kappa', label:'\\(\\kappa\\)', desc:'Rôle de l\'écart dans l\'inflation' },
      { id:'eps_x', label:'Choc \\(x\\) (pts)', desc:'Impulsion initiale de l\'écart' }
    ]
  },

  dsge: {
    name: 'DSGE (NK: IS, NKPC, règle de Taylor)',
    equations: [
      { latex: 'x_t = E_t x_{t+1} - \\frac{1}{\\sigma}(i_t - E_t\\pi_{t+1} - r^n_t)', desc:'IS intertemporelle' },
      { latex: '\\pi_t = \\beta E_t\\pi_{t+1} + \\kappa x_t', desc:'Courbe de Phillips' },
      { latex: 'i_t = \\phi_\\pi \\pi_t + \\phi_x x_t', desc:'Règle de Taylor (sans lissage ici)' },
      { latex: 'r^n_t = \\rho_r r^n_{t-1} + \\varepsilon^r_t', desc:'Taux naturel AR(1)' }
    ],
    explanation:
      "Résolution backward sur un horizon fini \\(T\\), avec conditions terminales nulles. À chaque date \\(t\\), on résout un système 2×2 en \\((x_t,\\pi_t)\\) sachant \\((x_{t+1},\\pi_{t+1})\\) et le choc sur \\(r^n_t\\).",
    params: [
      { id:'sigma',  label:'\\(\\sigma\\) (élasticité IS)', default:1.0, min:0.2, max:5.0, step:0.1 },
      { id:'beta',   label:'\\(\\beta\\) (escompte)', default:0.99, min:0.9, max:0.999, step:0.001 },
      { id:'kappa',  label:'\\(\\kappa\\) (pente NKPC)', default:0.1, min:0.01, max:1.0, step:0.01 },
      { id:'phi_pi', label:'\\(\\phi_{\\pi}\\) (réactivité inflation)', default:1.5, min:1.0, max:3.0, step:0.1 },
      { id:'phi_x',  label:'\\(\\phi_x\\) (réactivité écart)', default:0.5, min:0.0, max:2.0, step:0.05 },
      { id:'rho_r',  label:'\\(\\rho_r\\) (persistance \\(r^n\\))', default:0.8, min:0.0, max:0.99, step:0.01 },
      { id:'eps_r',  label:'Choc \\(r^n\\) (pts)', default:1.0, min:-5.0, max:5.0, step:0.1 },
      { id:'T',      label:'Horizon (T)', default:80, min:20, max:300, step:1 }
    ],
    sliders: [
      { id:'phi_pi', label:'\\(\\phi_{\\pi}\\)', desc:'Plus élevé ⇒ stabilise mieux l\'inflation' },
      { id:'phi_x',  label:'\\(\\phi_x\\)', desc:'Sensibilité de la règle à l\'écart' },
      { id:'eps_r',  label:'Choc \\(r^n\\) (pts)', desc:'Impulsion du taux naturel au début' }
    ]
  }
};

/* ========= Rendu du modèle & UI ========= */
function updateModelDisplay() {
  currentModel = document.getElementById('model-type').value;
  const model = models[currentModel];
  const display = document.getElementById('model-display');

  let html = '<div class="equation-block"><h4 style="color:#2a2a2a;margin-bottom:15px;">Équations</h4>';
  model.equations.forEach(eq => {
    html += `<div style="margin:15px 0;">
               <div>$$${eq.latex}$$</div>
               <div style="color:#5a5a5a;font-size:.9rem;margin-top:5px;font-style:italic;">${eq.desc}</div>
             </div>`;
  });
  html += '</div>';
  html += `<div class="explanation"><strong>Aperçu :</strong><br>${model.explanation}</div>`;
  display.innerHTML = html;
  renderAllMath(display);

  // Reset & MAJ autres vues
  solution = null; initialSolution = null;
  updateParamsDisplay();
  updateSliders();
  updateLegend();
  liveSolve();
}

/* ========= Paramétrage ========= */
function updateParamsDisplay() {
  const model = models[currentModel];
  const container = document.getElementById('params-content');

  let html = '<table class="param-table"><thead><tr><th>Paramètre</th><th>Valeur</th></tr></thead><tbody>';
  model.params.forEach(p => {
    const step = p.step || 1;
    html += `<tr>
      <th>${p.label}</th>
      <td><input type="number" id="param-${p.id}" value="${p.default}" min="${p.min}" max="${p.max}" step="${step}"></td>
    </tr>`;
    modelParams[p.id] = p.default;
  });
  html += '</tbody></table>';
  container.innerHTML = html;
  renderAllMath(container);

  // Input live + synchro sliders + graph
  model.params.forEach(p => {
    const el = document.getElementById(`param-${p.id}`);
    if (!el) return;
    el.addEventListener('input', (e) => {
      modelParams[p.id] = parseFloat(e.target.value);
      syncSlidersFromParams();
      liveSolve();
    });
  });
}

/* ========= Solveurs ========= */

// Utilitaires
function ar1_path(T, rho, shock0=0) {
  const x = new Array(T).fill(0);
  if (T>0) x[0] = shock0;
  for (let t=1; t<T; t++) x[t] = rho * x[t-1];
  return x;
}
function solve2x2(a,b,c,d, u, v){ // [[a,b],[c,d]] [x;y] = [u;v]
  const det = a*d - b*c;
  return { x: (u*d - b*v)/det, y: (a*v - u*c)/det };
}

// Calcul avec option de redirection
function solveModel(redirect=true) {
  if (!initialSolution) initialParams = JSON.parse(JSON.stringify(modelParams));

  // Sync inputs depuis Paramétrage
  models[currentModel].params.forEach(p => {
    const input = document.getElementById(`param-${p.id}`);
    if (input) modelParams[p.id] = parseFloat(input.value);
  });

  // Dispatch solveur
  if (currentModel === 'rbc') solveRBC();
  else if (currentModel === 'ak') solveAK();
  else if (currentModel === 'adaptive') solveAdaptive();
  else if (currentModel === 'rational') solveRational();
  else if (currentModel === 'dsge') solveDSGE();

  if (!initialSolution) initialSolution = JSON.parse(JSON.stringify(solution));
  displayDetailedResults();
  updateLegend();
  drawGraph();

  if (redirect) {
    const solveBtn = document.querySelectorAll('.tab-btn')[2];
    openTab('solve', solveBtn);
  }
}

/* ----- RBC ----- */
function steadyStateRBC(alpha,beta,delta,Abar){
  // α A k^{α-1} = 1/β - (1-δ)
  const term = (1.0/beta) - (1.0 - delta);
  const k = Math.pow(alpha*Abar/term, 1.0/(1.0-alpha));
  const y = Abar*Math.pow(k, alpha);
  const i = delta*k;
  const c = y - i;
  const s = i / y;
  return {k,y,i,c,s};
}
function solveRBC() {
  const { alpha, beta, delta, Abar, rhoA, epsA, T, k0 } = modelParams;
  const Tint = Math.max(2, Math.floor(T));
  const z = ar1_path(Tint, rhoA, epsA/100.0); // log-choc
  const A = z.map(zt => Abar * Math.exp(zt));

  const ss = steadyStateRBC(alpha,beta,delta,Abar);
  const sStar = ss.s;

  const K = new Array(Tint+1).fill(0); K[0] = k0;
  const Y = new Array(Tint).fill(0);
  const I = new Array(Tint).fill(0);
  const C = new Array(Tint).fill(0);

  for (let t=0; t<Tint; t++){
    Y[t] = A[t]*Math.pow(K[t], alpha);
    I[t] = sStar * Y[t];
    C[t] = Y[t] - I[t];
    K[t+1] = I[t] + (1.0 - delta)*K[t];
  }

  // % écarts vs état stationnaire initial (Abar)
  const dev = (arr, ssVal) => arr.map(v => 100*(v-ssVal)/ssVal);
  const Ydev = dev(Y, ss.y);
  const Cdev = dev(C, ss.c);
  const Idev = dev(I, ss.i);

  solution = {
    series: { t: [...Array(Tint).keys()], Y, C, I, K:K.slice(0,Tint+1), A, Ydev, Cdev, Idev },
    ss, metrics: { sStar }
  };
}

/* ----- AK ----- */
function solveAK() {
  const { A, s, delta, T, k0, shockA } = modelParams;
  const Tint = Math.max(2, Math.floor(T));
  const Apath = new Array(Tint).fill(A);
  if (Tint>1) Apath[1] = A*(1+shockA/100.0);

  const K = new Array(Tint+1).fill(0); K[0]=k0;
  const Y = new Array(Tint).fill(0);
  const C = new Array(Tint).fill(0);
  for (let t=0; t<Tint; t++){
    Y[t] = Apath[t]*K[t];
    const I = s*Y[t];
    C[t] = (1-s)*Y[t];
    K[t+1] = I + (1-delta)*K[t];
  }
  const Y0 = Y[0]||1, C0 = C[0]||1, K0 = K[0]||1;
  const dev = (arr, base) => arr.map(v => 100*(v-base)/base);
  const g = s*A - delta;

  solution = {
    series:{ t:[...Array(Tint).keys()], Y, C, K:K.slice(0,Tint+1),
             Ydev:dev(Y,Y0), Cdev:dev(C,C0), Kdev:dev(K.slice(0,Tint),K0) },
    ss:null,
    metrics:{ g }
  };
}

/* ----- Anticipations adaptatives ----- */
function solveAdaptive() {
  const { gamma, lambda, rho_x, eps_x, pi_e0, T } = modelParams;
  const Tint = Math.max(2, Math.floor(T));
  const x = ar1_path(Tint, rho_x, eps_x); // pts
  const pi_e = new Array(Tint+1).fill(0); pi_e[0]=pi_e0;
  const pi = new Array(Tint).fill(0);

  for (let t=0; t<Tint; t++){
    pi[t] = pi_e[t] + gamma*x[t];
    pi_e[t+1] = pi_e[t] + lambda*(pi[t]-pi_e[t]);
  }
  solution = {
    series:{ t:[...Array(Tint).keys()], x, pi, pi_e:pi_e.slice(0,Tint) },
    metrics:{ final_pi: pi[Tint-1], final_pi_e: pi_e[Tint] }
  };
}

/* ----- Anticipations rationnelles (NKPC) ----- */
function solveRational() {
  const { beta, kappa, rho_x, eps_x, T } = modelParams;
  const Tint = Math.max(2, Math.floor(T));
  const x = ar1_path(Tint, rho_x, eps_x);
  const pi = new Array(Tint).fill(0);

  // π_t = κ Σ_{j=0}^{T-1-t} β^j x_{t+j}
  for (let t=0; t<Tint; t++){
    let s=0, pow=1;
    for (let j=0; j<Tint-t; j++){
      if (j>0) pow *= beta;
      s += pow * x[t+j];
    }
    pi[t] = kappa * s;
  }
  solution = { series:{ t:[...Array(Tint).keys()], x, pi }, metrics:{ pi0: pi[0] } };
}

/* ----- DSGE NK (IS–NKPC–Taylor) ----- */
function solveDSGE() {
  const { sigma, beta, kappa, phi_pi, phi_x, rho_r, eps_r, T } = modelParams;
  const Tint = Math.max(2, Math.floor(T));

  const rn = ar1_path(Tint, rho_r, eps_r);    // r^n_t (pts)
  const x = new Array(Tint).fill(0);
  const pi = new Array(Tint).fill(0);
  const i = new Array(Tint).fill(0);

  // Conditions terminales
  const x_next = new Array(Tint+1).fill(0);
  const pi_next = new Array(Tint+1).fill(0);
  x_next[Tint]=0; pi_next[Tint]=0;

  // Backward: t = T-1...0
  for (let t=Tint-1; t>=0; t--){
    const A1 = 1 + (phi_x/sigma);
    const A2 = (phi_pi/sigma);
    const Kt = x_next[t+1] + (1.0/sigma)*(pi_next[t+1] + rn[t]);
    // Système:
    // A1 x_t + A2 π_t = Kt
    // -κ x_t + 1*π_t  = β π_{t+1}
    const sol = solve2x2(A1, A2, -kappa, 1.0, Kt, beta*pi_next[t+1]);
    x[t] = sol.x; pi[t] = sol.y;
    i[t] = phi_pi*pi[t] + phi_x*x[t];
    x_next[t] = x[t]; pi_next[t] = pi[t];
  }

  solution = { series:{ t:[...Array(Tint).keys()], x, pi, i, rn }, metrics:{ peak_pi: Math.max(...pi), peak_x: Math.max(...x) } };
}

/* ========= Canvas: axes & time-series ========= */
function clearCanvas() {
  const c = canvas(); const context = ctx();
  context.save(); context.setTransform(1,0,0,1,0,0);
  context.clearRect(0,0,c.width,c.height); context.restore();
}
function drawAxesTS(context, yMin, yMax, T) {
  const m = 50;
  context.strokeStyle = '#BBBBBB'; context.lineWidth = 1;
  // axes
  context.beginPath();
  context.moveTo(m+panX, (canvas().height - m) + panY);
  context.lineTo((canvas().width - m) + panX, (canvas().height - m) + panY);
  context.moveTo(m+panX, m + panY);
  context.lineTo(m+panX, (canvas().height - m) + panY);
  context.stroke();

  // ticks
  const ticks = 4; context.fillStyle='#666'; context.font='12px serif';
  for (let i=0;i<=ticks;i++){
    const x = m + (i/ticks)*(canvas().width-2*m);
    const tLab = Math.round(i/ticks*(T-1));
    context.fillText(tLab.toString(), x-4+panX, (canvas().height - m)+20+panY);
  }
  for (let j=0;j<=ticks;j++){
    const y = (canvas().height - m) - (j/ticks)*(canvas().height-2*m);
    const v = yMin + (j/ticks)*(yMax - yMin);
    context.fillText(v.toFixed(1), m-40+panX, y+4+panY);
  }
}
function xMapTS(t, T){
  const m=50, W = canvas().width - 2*m;
  return m + (t/(T-1))*W;
}
function yMapTS(v, yMin, yMax){
  const m=50, H = canvas().height - 2*m;
  return (canvas().height - m) - ((v - yMin)/(yMax - yMin))*H;
}
function drawSeries(context, tArr, yArr, yMin, yMax, color='#000', width=2){
  context.strokeStyle=color; context.lineWidth=width; context.beginPath();
  tArr.forEach((t,i)=>{
    const x = xMapTS(t, tArr.length);
    const y = yMapTS(yArr[i], yMin, yMax);
    if (i===0) context.moveTo(x+panX, y+panY); else context.lineTo(x+panX, y+panY);
  }); context.stroke();
}

function drawGraph() {
  const c = canvas(); if (!c) return;
  const context = ctx();
  clearCanvas();

  context.save();
  context.translate((c.width/2)*(1-zoomLevel), (c.height/2)*(1-zoomLevel));
  context.scale(zoomLevel, zoomLevel);

  if (!solution || !solution.series) { context.restore(); return; }

  const s = solution.series;
  const T = (s.t||[]).length || 2;

  // Séries à tracer (monochrome)
  let bundles = [];
  if (currentModel==='rbc') {
    bundles = [
      { arr: s.Ydev, color:'#000' },
      { arr: s.Cdev, color:'#555' },
      { arr: s.Idev, color:'#888' }
    ];
  } else if (currentModel==='ak') {
    bundles = [
      { arr: s.Ydev, color:'#000' },
      { arr: s.Cdev, color:'#555' },
      { arr: s.Kdev, color:'#888' }
    ];
  } else if (currentModel==='adaptive') {
    bundles = [
      { arr: s.pi, color:'#000' },
      { arr: s.pi_e, color:'#555' },
      { arr: s.x, color:'#888' }
    ];
  } else if (currentModel==='rational') {
    bundles = [
      { arr: s.pi, color:'#000' },
      { arr: s.x, color:'#666' }
    ];
  } else if (currentModel==='dsge') {
    bundles = [
      { arr: s.pi, color:'#000' },
      { arr: s.x, color:'#555' },
      { arr: s.i, color:'#888' }
    ];
  }

  // bornes Y automatiques (avec marge)
  let ymin=+Infinity, ymax=-Infinity;
  bundles.forEach(b => b.arr.forEach(v => { if(isFinite(v)){ ymin=Math.min(ymin,v); ymax=Math.max(ymax,v); }}));
  if (!isFinite(ymin) || !isFinite(ymax)) { ymin=-1; ymax=1; }
  const pad = 0.1*(ymax - ymin || 1);
  ymin -= pad; ymax += pad;

  drawAxesTS(context, ymin, ymax, T);
  bundles.forEach(b => drawSeries(context, s.t, b.arr, ymin, ymax, b.color, 2));

  context.restore();
}

/* ========= Export LaTeX CORRIGÉ ========= */
function exportLatex(){
  const now = new Date().toISOString().slice(0,10);
  const model = models[currentModel];
  const num = (x, d=3) => (typeof x === 'number' ? x.toFixed(d) : x);

  // Fonction d'échappement LaTeX
  const escapeLatex = (str) => {
    if (typeof str !== 'string') return str;
    return str
      .replace(/\\/g, '\\textbackslash{}')
      .replace(/#/g, '\\#')
      .replace(/\$/g, '\\$')
      .replace(/%/g, '\\%')
      .replace(/&/g, '\\&')
      .replace(/_/g, '\\_')
      .replace(/{/g, '\\{')
      .replace(/}/g, '\\}')
      .replace(/~/g, '\\textasciitilde{}')
      .replace(/\^/g, '\\textasciicircum{}');
  };

  let body = '';
  body += '\\section*{Modèle sélectionné: ' + escapeLatex(model.name) + '}\n';
  body += '\\subsection*{Équations}\n\\begin{align*}\n';
  model.equations.forEach(eq => { 
    body += escapeLatex(eq.latex) + ' \\\\\n'; 
  });
  body += '\\end{align*}\n\n';

  // Paramètres
  body += '\\subsection*{Paramètres}\n\\begin{tabular}{ll}\n\\hline\n';
  body += 'Paramètre & Valeur \\\\\n\\hline\n';
  model.params.forEach(p => { 
    body += escapeLatex(p.label.replace(/\\\(/g, '$').replace(/\\\)/g, '$')) + ' & ' + num(modelParams[p.id], 6) + ' \\\\\n'; 
  });
  body += '\\hline\n\\end{tabular}\n\n';

  // Résultats
  body += '\\subsection*{Résultats}\n';
  if (currentModel === 'rbc' && solution?.ss){
    const ss = solution.ss, sStar = solution.metrics.sStar;
    body += `$k^{*}=${num(ss.k)}$,\\ $y^{*}=${num(ss.y)}$,\\ $c^{*}=${num(ss.c)}$,\\ $i^{*}=${num(ss.i)}$,\\ $s^{*}=${num(sStar)}$.\n`;
  } else if (currentModel === 'ak' && solution?.metrics) {
    body += `$g \\approx sA - \\delta = ${num(solution.metrics.g)}$.\n`;
  } else if (currentModel === 'adaptive' && solution?.metrics) {
    body += `$\\pi_T=${num(solution.metrics.final_pi)}$,\\ $\\pi^e_T=${num(solution.metrics.final_pi_e)}$.\n`;
  } else if (currentModel === 'rational' && solution?.metrics) {
    body += `$\\pi_0=${num(solution.metrics.pi0)}$.\n`;
  } else if (currentModel === 'dsge' && solution?.metrics) {
    body += `$\\max_t\\,\\pi_t = ${num(solution.metrics.peak_pi)}$,\\ $\\max_t\\,x_t = ${num(solution.metrics.peak_x)}$.\n`;
  }

  const tex = `\\documentclass[11pt,a4paper]{article}
\\usepackage[margin=2.5cm]{geometry}
\\usepackage{amsmath,amssymb}
\\usepackage{booktabs}
\\usepackage{ifthen}
\\usepackage{iftex}

\\ifPDFTeX
  \\usepackage{mathpazo}
\\else
  \\IfFileExists{EBGaramond.sty}{
    \\usepackage{EBGaramond}
  }{
    \\usepackage{mathpazo}
  }
\\fi

\\usepackage[T1]{fontenc}
\\usepackage[utf8]{inputenc}
\\title{Export automatique — Modèles macroéconomiques avancés}
\\author{Ramanambonona Ambinintsoa}
\\date{${now}}
\\begin{document}
\\maketitle
${body}
\\end{document}`;

  const blob = new Blob([tex], {type: 'text/x-tex;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); 
  a.href = url; 
  a.download = `macro_advanced_${currentModel}.tex`; 
  a.click();
  URL.revokeObjectURL(url);
}

/* ========= Interactions canvas ========= */
function attachCanvasInteractions() {
  const c = canvas(); c.style.cursor = 'grab';
  c.addEventListener('mousedown', e => { isDragging=true; lastX=e.offsetX; lastY=e.offsetY; c.style.cursor='grabbing'; });
  window.addEventListener('mouseup', () => { isDragging=false; canvas().style.cursor='grab'; });
  c.addEventListener('mousemove', e => {
    if (!isDragging) return;
    panX += (e.offsetX - lastX); panY += (e.offsetY - lastY);
    lastX = e.offsetX; lastY = e.offsetY; drawGraph();
  });
  c.addEventListener('wheel', e => { e.preventDefault(); (e.deltaY<0)?zoomIn():zoomOut(); }, { passive:false });
}

// S'assurer que KaTeX est chargé
document.addEventListener('DOMContentLoaded', () => {
  // Initialiser le rendu mathématique
  if (window.renderMathInElement) {
    renderAllMath(document.body);
  }
  
  initialSetup();
});
